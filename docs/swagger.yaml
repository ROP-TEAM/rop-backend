definitions:
  dto.CreateOrder:
    properties:
      capacity:
        type: number
      des_latitude:
        type: number
      des_longitude:
        type: number
      name:
        type: string
      note:
        type: string
      priority:
        description: 0-3
        type: integer
      service_time:
        type: integer
      tag_skill_id:
        items:
          type: integer
        type: array
      time_window_end:
        type: integer
      time_window_start:
        type: integer
      type:
        description: 0=delivery,1=pickup
        type: integer
    type: object
  dto.CreatePlanRequest:
    properties:
      name:
        example: untangle
        type: string
      plan_date:
        example: 2026-05-05 15:44:09.523069+00
        type: string
    type: object
  dto.CreatePlanResponse:
    properties:
      created_at:
        example: 2026-05-05 15:44:09.523069+00
        type: string
      id:
        example: whatthehell
        type: string
      name:
        example: what
        type: string
    type: object
  dto.CreateTagSkill:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.CreateVehicle:
    properties:
      capacity:
        type: number
      daily_break_time_end:
        type: integer
      daily_break_time_start:
        type: integer
      daily_work_time_end:
        type: integer
      daily_work_time_start:
        type: integer
      end_latitude:
        type: number
      end_longitude:
        type: number
      max_task:
        type: integer
      model:
        type: string
      name:
        type: string
      plate_number:
        type: string
      profile_id:
        type: integer
      start_latitude:
        type: number
      start_longitude:
        type: number
      tag_skills:
        items:
          $ref: '#/definitions/dto.VehicleTagSkill'
        type: array
    type: object
  dto.DeletePlanByIDRequest:
    type: object
  dto.DeletePlanByIDResponse:
    properties:
      message:
        example: plan deleted
        type: string
    type: object
  dto.DeleteVehicle:
    properties:
      id:
        items:
          type: integer
        type: array
      plan_id:
        type: string
    type: object
  dto.DuplicatePlanByIDRequest:
    type: object
  dto.DuplicatePlanByIDResponse:
    properties:
      id:
        example: whatthehell
        type: string
      name:
        example: vhkp9^,lvo0y[0bh'0dsojvp]
        type: string
    type: object
  dto.GroupCreateOrder:
    properties:
      orders:
        items:
          $ref: '#/definitions/dto.CreateOrder'
        type: array
      plan_id:
        type: string
    type: object
  dto.GroupCreateTagSkill:
    properties:
      plan_id:
        type: string
      skills:
        items:
          $ref: '#/definitions/dto.CreateTagSkill'
        type: array
    type: object
  dto.GroupCreateVehicle:
    properties:
      plan_id:
        type: string
      vehicles:
        items:
          $ref: '#/definitions/dto.CreateVehicle'
        type: array
    type: object
  dto.LocationInput:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  dto.MatrixRequest:
    properties:
      locations:
        items:
          $ref: '#/definitions/dto.LocationInput'
        type: array
    type: object
  dto.OTPErrorInfo:
    properties:
      code:
        type: string
      detail:
        type: string
    type: object
  dto.OTPResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/dto.OTPErrorInfo'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.OptimizeOrder:
    properties:
      capacity:
        type: integer
      desLatitude:
        type: number
      desLongitude:
        type: number
      name:
        type: string
      priority:
        type: integer
      serviceTime:
        type: integer
      skill:
        type: string
      timeWindowEnd:
        type: integer
      timeWindowStart:
        type: integer
      type:
        type: integer
    type: object
  dto.OptimizeRequest:
    properties:
      depotLat:
        type: number
      depotLon:
        type: number
      enableAlns:
        type: boolean
      enableMultiTrip:
        type: boolean
      orders:
        items:
          $ref: '#/definitions/dto.OptimizeOrder'
        minItems: 1
        type: array
      reloadMin:
        description: minutes; 0 = server default (30)
        type: integer
      seed:
        description: 0 = non-deterministic
        type: integer
      timeLimitMS:
        description: 0 = server default (5000)
        type: integer
      vehicles:
        items:
          $ref: '#/definitions/dto.OptimizeVehicle'
        minItems: 1
        type: array
    required:
    - depotLat
    - depotLon
    - orders
    - vehicles
    type: object
  dto.OptimizeVehicle:
    properties:
      breakTimeEnd:
        type: integer
      breakTimeStart:
        type: integer
      capacity:
        type: integer
      endLatitude:
        type: number
      endLongitude:
        type: number
      maxTask:
        type: integer
      model:
        type: string
      name:
        type: string
      plateNumber:
        type: string
      skills:
        items:
          $ref: '#/definitions/dto.CreateTagSkill'
        type: array
      startLatitude:
        type: number
      startLongitude:
        type: number
      workTimeEnd:
        type: integer
      workTimeStart:
        type: integer
    type: object
  dto.RequestOTPRequest:
    properties:
      tel:
        example: "0812345678"
        type: string
    required:
    - tel
    type: object
  dto.RequestOTPResponse:
    properties:
      attempts:
        example: 0
        type: integer
      expires_at:
        type: string
      max_attempts:
        example: 5
        type: integer
      refNo:
        example: ABC123
        type: string
      status:
        example: success
        type: string
      tel:
        example: "0999999999"
        type: string
    type: object
  dto.UpdateOrder:
    properties:
      capacity:
        type: number
      des_latitude:
        type: number
      des_longitude:
        type: number
      name:
        type: string
      note:
        type: string
      plan_id:
        type: string
      priority:
        type: integer
      service_time:
        type: integer
      tag_skill_id:
        items:
          type: integer
        type: array
      time_window_end:
        type: integer
      time_window_start:
        type: integer
      type:
        type: integer
    type: object
  dto.UpdatePlanNameByIDRequest:
    properties:
      name:
        example: united in grief
        type: string
    type: object
  dto.UpdatePlanNameByIDResponse:
    properties:
      name:
        example: united in grief
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateVehicle:
    properties:
      capacity:
        type: number
      daily_break_time_end:
        type: integer
      daily_break_time_start:
        type: integer
      daily_work_time_end:
        type: integer
      daily_work_time_start:
        type: integer
      end_latitude:
        type: number
      end_longitude:
        type: number
      max_task:
        type: integer
      model:
        type: string
      name:
        type: string
      plan_id:
        type: string
      plate_number:
        type: string
      profile_id:
        type: integer
      start_latitude:
        type: number
      start_longitude:
        type: number
      tag_skills:
        items:
          $ref: '#/definitions/dto.VehicleTagSkill'
        type: array
    type: object
  dto.VehicleTagSkill:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.VerifyOTPRequest:
    properties:
      pin:
        example: "123456"
        type: string
      refNo:
        example: ABC123
        type: string
      tel:
        example: "0812345678"
        type: string
    required:
    - pin
    - refNo
    - tel
    type: object
  dto.VerifyOTPResponse:
    properties:
      status:
        example: success
        type: string
    type: object
  handlers.CreateResponse:
    properties:
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      needOnboarding:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.OTPResponse:
    properties:
      message:
        type: string
    type: object
  handlers.OnboardingResponse:
    properties:
      message:
        type: string
    type: object
  handlers.UserResponse:
    properties:
      email:
        type: string
      user_id:
        type: integer
    type: object
  models.Company:
    properties:
      address:
        type: string
      district:
        type: string
      id:
        type: string
      name:
        type: string
      postal_code:
        type: string
      province:
        type: string
      sub_district:
        type: string
      tel:
        type: string
      type:
        type: string
    type: object
  models.OnboardingPayload:
    properties:
      address:
        example: 123 ถนนสุขุมวิท
        type: string
      companyName:
        example: ABC Co.
        type: string
      companyType:
        example: SME
        type: string
      district:
        example: Pathum Wan
        type: string
      postalCode:
        example: "10330"
        type: string
      province:
        example: Bangkok
        type: string
      subDistrict:
        example: Lumphini
        type: string
    type: object
  models.User:
    properties:
      company:
        $ref: '#/definitions/models.Company'
      companyID:
        type: string
      email:
        type: string
      google_id:
        type: string
      is_need_on_boarding:
        type: boolean
      is_validated:
        type: boolean
      name:
        description: gorm.Model
        type: string
      tel:
        type: string
    type: object
  response.BuildMatrixResponse:
    properties:
      message:
        type: string
      node:
        type: integer
      provider:
        type: string
      result:
        $ref: '#/definitions/response.MatrixResponse'
    type: object
  response.DropReasonResponse:
    properties:
      code:
        type: string
      detail:
        type: string
      orderName:
        type: string
    type: object
  response.MatrixResponse:
    properties:
      distances:
        items:
          items:
            type: integer
          type: array
        type: array
      durations:
        items:
          items:
            type: integer
          type: array
        type: array
    type: object
  response.OptimizeResponse:
    properties:
      dropReasons:
        items:
          $ref: '#/definitions/response.DropReasonResponse'
        type: array
      routes:
        items:
          $ref: '#/definitions/response.RouteResponse'
        type: array
      status:
        type: string
      unassigned:
        items:
          type: string
        type: array
    type: object
  response.OrderResponse:
    properties:
      capacity:
        type: number
      name:
        type: string
      note:
        type: string
      priority:
        description: 0-3
        type: integer
      service_time:
        type: integer
      tag_skill_id:
        items:
          type: integer
        type: array
      type:
        description: 0=delivery,1=pickup
        type: integer
    type: object
  response.RouteResponse:
    properties:
      stops:
        items:
          $ref: '#/definitions/response.StopResponse'
        type: array
      totalDistance:
        type: number
      totalDuration:
        type: number
      tripSizes:
        items:
          type: integer
        type: array
      vehicleName:
        type: string
    type: object
  response.StopResponse:
    properties:
      arrivalMin:
        type: integer
      departMin:
        type: integer
      orderName:
        type: string
    type: object
  response.TagSkillGroupResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/response.TagSkillResponse'
        type: array
      message:
        type: string
    type: object
  response.TagSkillResponse:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
      order_count:
        type: integer
      vehicle_count:
        type: integer
    type: object
  response.VehicleGroupResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/response.VehicleResponse'
        type: array
      message:
        type: string
    type: object
  response.VehicleResponse:
    properties:
      capacity:
        type: number
      max_task:
        type: integer
      model:
        type: string
      name:
        type: string
      plate_number:
        type: string
      profile_id:
        type: integer
      tag_skills:
        items:
          $ref: '#/definitions/response.TagSkillResponse'
        type: array
      vehicle_id:
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/auth/google:
    post:
      consumes:
      - application/json
      description: Verify Google ID Token and return JWT
      parameters:
      - description: Google ID Token
        in: body
        name: body
        required: true
        schema:
          properties:
            id_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login with Google
      tags:
      - auth
  /api/auth/otp:
    post:
      description: Use for testing OTP rate limiter (1 request per minute)
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OTPResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Test OTP endpoint
      tags:
      - otp
  /api/matrix:
    post:
      consumes:
      - application/json
      description: Build an n×n distance matrix from a list of lat/lng locations.
        Durations in minutes, distances in meters.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: List of locations (min 2)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.MatrixRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BuildMatrixResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Build distance matrix
      tags:
      - matrix
  /api/onboarding:
    post:
      consumes:
      - application/json
      description: Save company and user info (step before OTP)
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Onboarding data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.OnboardingPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OnboardingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User onboarding
      tags:
      - user
  /api/onboarding/otp:
    post:
      consumes:
      - application/json
      description: Send an OTP SMS to the given phone number. Requires a valid JWT.
        Returns a refNo to use during verification.
      parameters:
      - description: Phone number payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RequestOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.OTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RequestOTPResponse'
              type: object
        "400":
          description: Missing/invalid tel field or malformed body
          schema:
            $ref: '#/definitions/dto.OTPResponse'
        "401":
          description: Missing or invalid JWT
          schema:
            $ref: '#/definitions/dto.OTPResponse'
        "409":
          description: Phone already verified / recent request exists / user exceeded
            request limit
          schema:
            $ref: '#/definitions/dto.OTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.OTPResponse'
        "502":
          description: Upstream OTP provider unavailable
          schema:
            $ref: '#/definitions/dto.OTPResponse'
      security:
      - BearerAuth: []
      summary: Request OTP
      tags:
      - onboarding
  /api/onboarding/otp/verify:
    post:
      consumes:
      - application/json
      description: Verify an OTP pin using the refNo and phone number from the request
        step. Increments attempt count on failure and marks the OTP as used on success.
      parameters:
      - description: OTP verification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified; user phone validated
          schema:
            allOf:
            - $ref: '#/definitions/dto.OTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.VerifyOTPResponse'
              type: object
        "400":
          description: Missing/invalid tel, pin, or refNo — or record not found
          schema:
            $ref: '#/definitions/dto.OTPResponse'
        "401":
          description: Incorrect OTP pin
          schema:
            $ref: '#/definitions/dto.OTPResponse'
        "409":
          description: OTP expired / already used / max attempts reached
          schema:
            $ref: '#/definitions/dto.OTPResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.OTPResponse'
      summary: Verify OTP
      tags:
      - onboarding
  /api/optimize:
    post:
      consumes:
      - application/json
      description: Optimize vehicle routing problem given vehicles and orders
      parameters:
      - description: optimize request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OptimizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.OptimizeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.OptimizeResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Optimize vehicle routing
      tags:
      - planning
  /api/orders:
    delete:
      consumes:
      - application/json
      description: Delete multiple orders
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Order IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteVehicle'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete order list
      tags:
      - order
    post:
      consumes:
      - application/json
      description: Create multiple orders
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Order list
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GroupCreateOrder'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create order list
      tags:
      - order
  /api/orders/{id}:
    patch:
      consumes:
      - application/json
      description: Patch order by id
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Order update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateOrder'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update order
      tags:
      - order
  /api/plan:
    post:
      consumes:
      - application/json
      description: Create a plan
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: plan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreatePlanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create plan
      tags:
      - plan
  /api/plan/:id:
    delete:
      consumes:
      - application/json
      description: hard delete plan by id by attach plan id via url params, it will
        delte all its legacy
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: plan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeletePlanByIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeletePlanByIDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete plan by plan id
      tags:
      - plan
    patch:
      consumes:

definitions:
  handlers.APIResponse:
    properties:
      data: {}
      message:
        example: OTP sent successfully
        type: string
      status:
        description: suc/fail/err
        example: success
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      needOnboarding:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.OnboardingResponse:
    properties:
      message:
        type: string
    type: object
  handlers.UserResponse:
    properties:
      email:
        type: string
      user_id:
        type: integer
    type: object
  models.Company:
    properties:
      address:
        type: string
      alley:
        type: string
      district:
        type: string
      id:
        type: integer
      name:
        type: string
      postal_code:
        type: string
      province:
        type: string
      sub_district:
        type: string
      tel:
        type: string
      type:
        type: string
    type: object
  models.OnboardingPayload:
    properties:
      address:
        example: 123 ถนนสุขุมวิท
        type: string
      alley:
        example: Soi 5
        type: string
      companyName:
        example: ABC Co.
        type: string
      companyType:
        example: SME
        type: string
      district:
        example: Pathum Wan
        type: string
      postalCode:
        example: "10330"
        type: string
      province:
        example: Bangkok
        type: string
      subDistrict:
        example: Lumphini
        type: string
      tel:
        example: "0999999999"
        type: string
    type: object
  models.User:
    properties:
      company:
        $ref: '#/definitions/models.Company'
      companyID:
        type: integer
      email:
        type: string
      google_id:
        type: string
      is_validated:
        type: boolean
      name:
        type: string
      tel:
        type: string
      tel_otp:
        type: string
    type: object
  services.RequestOTPRequest:
    properties:
      tel:
        example: "0812345678"
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  services.RequestOTPResponse:
    properties:
      refNo:
        example: ABC123
        type: string
      status:
        example: success
        type: string
    type: object
  services.VerifyOTPRequest:
    properties:
      pin:
        example: "123456"
        type: string
      refNo:
        example: ABC123
        type: string
      tel:
        example: "0812345678"
        type: string
    type: object
  services.VerifyOTPResponse:
    properties:
      status:
        example: success
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/google:
    post:
      consumes:
      - application/json
      description: Verify Google ID Token and return JWT
      parameters:
      - description: Google ID Token
        in: body
        name: body
        required: true
        schema:
          properties:
            id_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login with Google
      tags:
      - auth
  /api/auth/otp:
    post:
      consumes:
      - application/json
      description: Send OTP to a phone number and receive token + refno
      parameters:
      - description: Phone number payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.RequestOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/services.RequestOTPResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Request OTP SMS
      tags:
      - auth
  /api/auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verify OTP pin using refNo and phone number. Handles expiration,
        attempt limits, and reuse protection.
      operationId: verify-otp
      parameters:
      - description: OTP verification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/services.VerifyOTPResponse'
              type: object
        "400":
          description: Invalid request body or missing fields
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Invalid OTP PIN
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "409":
          description: Expired / already used / max attempts reached
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Verify OTP
      tags:
      - auth
  /api/onboarding:
    post:
      consumes:
      - application/json
      description: Save company and user info (step before OTP)
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Onboarding data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.OnboardingPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OnboardingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User onboarding
      tags:
      - user
  /api/test:
    get:
      description: Get user_id from JWT
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - user
swagger: "2.0"

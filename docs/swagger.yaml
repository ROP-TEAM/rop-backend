definitions:
  handlers.APIResponse:
    properties:
      data: {}
      message:
        example: OTP sent successfully
        type: string
      status:
        description: suc/fail/err
        example: success
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      needOnboarding:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.OTPResponse:
    properties:
      message:
        type: string
    type: object
  handlers.OnboardingResponse:
    properties:
      message:
        type: string
    type: object
  handlers.UserResponse:
    properties:
      email:
        type: string
      user_id:
        type: integer
    type: object
  models.Company:
    properties:
      address:
        type: string
      alley:
        type: string
      district:
        type: string
      id:
        type: string
      name:
        type: string
      postal_code:
        type: string
      province:
        type: string
      sub_district:
        type: string
      tel:
        type: string
      type:
        type: string
    type: object
  models.OnboardingPayload:
    properties:
      address:
        example: 123 ถนนสุขุมวิท
        type: string
      companyName:
        example: ABC Co.
        type: string
      companyType:
        example: SME
        type: string
      district:
        example: Pathum Wan
        type: string
      postalCode:
        example: "10330"
        type: string
      province:
        example: Bangkok
        type: string
      subDistrict:
        example: Lumphini
        type: string
    type: object
  models.User:
    properties:
      company:
        $ref: '#/definitions/models.Company'
      companyID:
        type: integer
      email:
        type: string
      google_id:
        type: string
      is_validated:
        type: boolean
      name:
        type: string
      tel:
        type: string
      updatedAt:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/google:
    post:
      consumes:
      - application/json
      description: Verify Google ID Token and return JWT
      parameters:
      - description: Google ID Token
        in: body
        name: body
        required: true
        schema:
          properties:
            id_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login with Google
      tags:
      - auth
  /api/auth/otp:
    post:
      description: Use for testing OTP rate limiter (1 request per minute)
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OTPResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Test OTP endpoint
      tags:
      - otp
  /api/onboarding:
    post:
      consumes:
      - application/json
      description: Save company and user info (step before OTP)
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Onboarding data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.OnboardingPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OnboardingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User onboarding
      tags:
      - user
  /api/orders:
    delete:
      consumes:
      - application/json
      description: Delete multiple orders
      parameters:
      - description: Order IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteVehicle'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Delete order list
      tags:
      - order
    post:
      consumes:
      - application/json
      description: Create multiple orders
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Order list
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GroupCreateOrder'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create order list
      tags:
      - order
  /api/skills:
    post:
      consumes:
      - application/json
      description: Create multiple skills by plan
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Skill list
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GroupCreateTagSkill'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.TagSkillGroupResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create skill list
      tags:
      - skill
  /api/test:
    get:
      description: Get user_id from JWT
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - user
  /api/vehicles:
    delete:
      consumes:
      - application/json
      description: Delete multiple vehicles
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Vehicle IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteVehicle'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete vehicle list
      tags:
      - vehicle
    post:
      consumes:
      - application/json
      description: Create multiple vehicles
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Vehicle list
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GroupCreateVehicle'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.VehicleGroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create vehicle list
      tags:
      - vehicle
  /api/vehicles/{id}:
    patch:
      consumes:
      - application/json
      description: Patch vehicle by id
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: integer
      - description: Vehicle update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateVehicle'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.VehicleGroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update vehicle
      tags:
      - vehicle
swagger: "2.0"

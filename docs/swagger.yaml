definitions:
  dto.CarRequest:
    properties:
      breakTime:
        $ref: '#/definitions/dto.TimeRange'
      capacity:
        type: integer
      display:
        type: string
      endLocation:
        $ref: '#/definitions/dto.Location'
      id:
        type: integer
      maxTask:
        type: integer
      model:
        type: string
      skills:
        items:
          type: string
        type: array
      startLocation:
        $ref: '#/definitions/dto.Location'
      workTime:
        $ref: '#/definitions/dto.TimeRange'
    type: object
  dto.Location:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  dto.OnboardingPayload:
    properties:
      address:
        example: 123 ถนนสุขุมวิท
        type: string
      alley:
        example: Soi 5
        type: string
      companyName:
        example: ABC Co.
        type: string
      companyType:
        example: SME
        type: string
      district:
        example: Pathum Wan
        type: string
      postalCode:
        example: "10330"
        type: string
      province:
        example: Bangkok
        type: string
      subDistrict:
        example: Lumphini
        type: string
      tel:
        example: "0999999999"
        type: string
    type: object
  dto.OrderRequest:
    properties:
      capacity:
        type: integer
      deliveryWindow:
        $ref: '#/definitions/dto.TimeRange'
      id:
        type: integer
      location:
        $ref: '#/definitions/dto.Location'
      name:
        type: string
      priority:
        type: string
      serviceTime:
        type: integer
      skills:
        items:
          type: string
        type: array
      timeWindow:
        $ref: '#/definitions/dto.TimeRange'
      type:
        type: string
    type: object
  dto.PlanRequest:
    properties:
      cars:
        items:
          $ref: '#/definitions/dto.CarRequest'
        type: array
      orders:
        items:
          $ref: '#/definitions/dto.OrderRequest'
        type: array
    type: object
  dto.TimeRange:
    properties:
      end:
        type: string
      start:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      needOnboarding:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.OnboardingResponse:
    properties:
      message:
        type: string
    type: object
  handlers.PlanResponse:
    properties:
      message:
        type: string
    type: object
  handlers.UserResponse:
    properties:
      email:
        type: string
      user_id:
        type: integer
    type: object
  models.Company:
    properties:
      address:
        type: string
      alley:
        type: string
      district:
        type: string
      id:
        type: integer
      name:
        type: string
      postal_code:
        type: string
      province:
        type: string
      sub_district:
        type: string
      tel:
        type: string
      type:
        type: string
    type: object
  models.User:
    properties:
      company:
        $ref: '#/definitions/models.Company'
      companyID:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      google_id:
        type: string
      id:
        type: integer
      is_validated:
        type: boolean
      name:
        type: string
      tel:
        type: string
      tel_otp:
        type: string
      updatedAt:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/google:
    post:
      consumes:
      - application/json
      description: Verify Google ID Token and return JWT
      parameters:
      - description: Google ID Token
        in: body
        name: body
        required: true
        schema:
          properties:
            id_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login with Google
      tags:
      - auth
  /api/onboarding:
    post:
      consumes:
      - application/json
      description: Save company and user info (step before OTP)
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Onboarding data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.OnboardingPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OnboardingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User onboarding
      tags:
      - user
  /api/test:
    get:
      description: Get user_id from JWT
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - user
  /api/v1/plan:
    post:
      consumes:
      - application/json
      description: Receive cars and orders from frontend (no processing yet)
      parameters:
      - description: Plan payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PlanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create plan
      tags:
      - plan
swagger: "2.0"

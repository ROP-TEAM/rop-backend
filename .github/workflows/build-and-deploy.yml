# Release flow — pins rop-algorithm to latest GitHub Release tag.
# rop-algorithm must be public, or set GOPRIVATE + PAT in Docker build.
name: Build and Deploy

on:
  push:
    branches:
      - dev
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # - name: Configure Go private module access
      #   run: git config --global url."https://x-access-token:${{ secrets.ALGO_PAT }}@github.com/".insteadOf "https://github.com/"

      # - name: Set GOPRIVATE
      #   run: echo "GOPRIVATE=github.com/ROP-TEAM/rop-algorithm" >> $GITHUB_ENV

      # - name: Get latest rop-algorithm release tag
      #   id: algotag
      #   run: |
      #     TAG=$(gh api repos/ROP-TEAM/rop-algorithm/releases/latest --jq .tag_name 2>/dev/null || echo "")
      #     if [ -z "$TAG" ]; then
      #       echo "No release found — falling back to replace directive"
      #       echo "tag=" >> $GITHUB_OUTPUT
      #     else
      #       echo "Using rop-algorithm $TAG"
      #       echo "tag=$TAG" >> $GITHUB_OUTPUT
      #     fi
      #   env:
      #     GH_TOKEN: ${{ secrets.ALGO_PAT }}

      # - name: Pin rop-algorithm version in go.mod
      #   if: steps.algotag.outputs.tag != ''
      #   run: |
      #     go mod edit -require "github.com/ROP-TEAM/rop-algorithm@${{ steps.algotag.outputs.tag }}"
      #     go mod edit -dropreplace "github.com/ROP-TEAM/rop-algorithm"
      #     go mod tidy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        if: ${{ !env.ACT }}
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_OAUTH_SECRET }}

      # - name: Install kubectl
      #   uses: azure/setup-kubectl@v4
      #   with:
      #     version: "latest" 

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          IMAGE_TAG=$(echo "${{ needs.build.outputs.image }}" | head -n 1)
          echo "Deploying image: $IMAGE_TAG"
          kubectl set image deployment/rop-backend rop-backend=$IMAGE_TAG -n rop
          kubectl rollout status deployment/rop-backend -n rop --timeout=300s

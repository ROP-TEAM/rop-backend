# Release flow — pins rop-algorithm to latest GitHub Release tag.
# rop-algorithm must be public, or set GOPRIVATE + PAT in Docker build.
name: Build and Deploy

on:
  push:
    branches:
      - dev
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: rop-backend

      - name: Checkout rop-algorithm
        uses: actions/checkout@v4
        with:
          repository: ROP-TEAM/rop-algorithm
          path: rop-algorithm
          token: ${{ secrets.ALGO_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=dev-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rop-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        if: ${{ !env.ACT }}
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_OAUTH_SECRET }}

      # - name: Install kubectl
      #   uses: azure/setup-kubectl@v4
      #   with:
      #     version: "latest" 

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.build.outputs.image_tag }}"
          IMAGE_TAG_LOWER=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          echo "Deploying unique image: $IMAGE_TAG_LOWER"
          kubectl set image deployment/rop-backend rop-backend=$IMAGE_TAG_LOWER -n rop
          kubectl set env deployment/rop-backend SOLVER_BINARY_PATH=/app/solver -n rop
          kubectl rollout status deployment/rop-backend -n rop --timeout=300s
